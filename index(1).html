<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRM Estudio Jurídico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--side:#0f2342;--card:#ffffff;--line:#dbe3ee;--wine:#1c3a6b;--rose:#2a5aa8;--text:#0f1b2e;--mute:#5a6b84;--ok:#1f9d6b;--warn:#c98a1b;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);display:grid;grid-template-columns:270px 1fr;min-height:100vh}
button,input,select{font:inherit;color:inherit}
aside{background:var(--side);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px;padding:0 6px}
.mono{width:46px;height:46px;border:1.5px solid #9db9e4;border-radius:50%;display:grid;place-items:center;font:700 17px var(--serif);letter-spacing:1px;color:#fff}
.brand b{display:block;font:700 22px/1 var(--serif);letter-spacing:.5px}
.brand b{color:#fff}.brand span{color:rgba(255,255,255,.7);font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-left:3px solid transparent;padding:10px 12px;text-align:left;color:rgba(255,255,255,.72);cursor:pointer;border-radius:0 6px 6px 0;width:100%}
.item:hover{color:#fff;background:rgba(255,255,255,.07)}
.item.on{color:#fff;border-left-color:#9db9e4;background:rgba(255,255,255,.14)}
.item .n{font-size:12px;opacity:.85}
.sep{height:1px;background:rgba(255,255,255,.16);margin:12px 6px}
.small{background:none;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.78);padding:8px 12px;border-radius:5px;cursor:pointer;text-align:left}
.small:hover{color:#fff;border-color:#9db9e4}
main{padding:36px 44px;max-width:980px;width:100%}
h1,h2{font-family:var(--serif);margin:0;font-weight:700}
h2{font-size:38px;line-height:1.1}
.sub{color:var(--mute);margin:6px 0 26px}
.stats{box-shadow:0 1px 3px rgba(15,35,66,.08);display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:8px;margin-bottom:34px;background:var(--card)}
.stats div{padding:22px 24px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font:700 54px/1 var(--serif)}
.stats .act b{color:var(--rose)}
.stats span{color:var(--mute);font-size:14px}
h3.t{font:700 24px var(--serif);margin:0 0 6px}
.row{display:grid;grid-template-columns:200px 1fr 140px;gap:18px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:16px 0;cursor:pointer;text-align:left}
.row:hover .nm{color:var(--rose)}
.nm{font:700 21px var(--serif)}
.bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose)}
.cnt{color:var(--mute);font-size:14px;text-align:right}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.btn{background:var(--wine);color:#fff;border:0;padding:10px 18px;border-radius:22px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--mute);border:1px solid var(--line)}
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);color:var(--mute);padding:5px 14px;border-radius:16px;cursor:pointer}
.filters button.on{border-color:var(--wine);color:#fff;background:var(--wine)}
.case{box-shadow:0 1px 2px rgba(15,35,66,.06);border:1px solid var(--line);border-left-width:3px;background:var(--card);border-radius:6px;padding:16px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.case h4{margin:0;font:700 21px var(--serif)}
.num{color:var(--rose);font-size:13px}
.meta{color:var(--mute);font-size:13.5px}
.side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:end;gap:8px}
.st-activo{border-left-color:var(--ok)}.st-suspendido{border-left-color:var(--warn)}.st-concluido{border-left-color:var(--mute)}
select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.del{background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px}.del:hover{color:var(--rose)}
.empty{color:var(--mute);border:1px dashed var(--line);padding:34px;text-align:center;border-radius:8px}
dialog{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:26px;width:min(470px,92vw)}
dialog::backdrop{background:rgba(10,25,50,.55)}
dialog h2{font-size:28px;margin-bottom:14px}
label{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}
label input,label select{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px 10px;color:var(--text)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
@media(max-width:800px){
 body{display:block}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:14px;border-right:0;border-bottom:1px solid var(--line)}
 .brand{width:100%;margin-bottom:8px}.sep{display:none}
 .item{width:auto;border-left:0;border-bottom:2px solid transparent;border-radius:0;gap:8px}.item.on{border-bottom-color:#9db9e4;background:none}
 main{padding:22px 16px}h2{font-size:30px}
 .stats b{font-size:38px}.stats div{padding:14px}
 .row{grid-template-columns:1fr 100px}.row .bar{grid-column:1/3;order:3}
}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="mono" aria-hidden="true">LRM</div><div><b>LRM</b><span>Estudio Jurídico</span></div></div>
  <div id="nav" style="display:contents"></div>
  <div class="sep"></div>
  <button class="small" id="addMat">+ Nueva materia</button>
  <button class="small" id="exp">Descargar respaldo</button>
  <button class="small" id="imp">Cargar respaldo</button>
  <input type="file" id="file" accept=".json" hidden>
</aside>
<main id="view"></main>

<dialog id="dCaso"><form method="dialog" id="fCaso">
  <h2>Nuevo caso</h2>
  <label>Número de proceso<input name="numero" placeholder="09281-2026-00123" required></label>
  <label>Título del caso<input name="titulo" required></label>
  <label>Cliente o parte<input name="parte"></label>
  <label>Juzgado o fiscalía<input name="juzgado"></label>
  <label>Estado<select name="estado"><option value="activo">Activo</option><option value="suspendido">Suspendido</option><option value="concluido">Concluido</option></select></label>
  <div class="acts"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Guardar caso</button></div>
</form></dialog>

<dialog id="dMat"><form method="dialog" id="fMat">
  <h2>Nueva materia</h2>
  <label>Nombre<input name="nombre" placeholder="Ej. Tránsito" required></label>
  <div class="acts"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn">Agregar materia</button></div>
</form></dialog>

<script>
const KEY = "lrm-estudio-juridico-v1";
const ESTADOS = {activo:"Activo", suspendido:"Suspendido", concluido:"Concluido"};
const base = () => ({
  materias:[{id:"penal",nombre:"Derecho Penal"},{id:"civil",nombre:"Derecho Civil"},{id:"laboral",nombre:"Derecho Laboral"},{id:"familia",nombre:"Familia"},{id:"constitucional",nombre:"Constitucional"}],
  casos:[]});

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !S.materias) S = base();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };

let tab = "resumen", filtro = "todos";
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const casosDe = id => S.casos.filter(c => c.materia === id);
const activos = arr => arr.filter(c => c.estado === "activo").length;

function render(){
  $("#nav").innerHTML =
    `<button class="item ${tab==="resumen"?"on":""}" data-tab="resumen">Resumen</button><div class="sep"></div>` +
    S.materias.map(m => `<button class="item ${tab===m.id?"on":""}" data-tab="${m.id}"><span>${esc(m.nombre)}</span><span class="n">${activos(casosDe(m.id))}/${casosDe(m.id).length}</span></button>`).join("");
  tab === "resumen" ? renderResumen() : renderMateria();
}

function renderResumen(){
  $("#view").innerHTML = `
    <h2>Resumen del estudio</h2>
    <p class="sub">Todos los casos de LRM, por materia.</p>
    <div class="stats">
      <div><b>${S.casos.length}</b><span>casos en total</span></div>
      <div class="act"><b>${activos(S.casos)}</b><span>casos activos</span></div>
      <div><b>${S.materias.length}</b><span>materias</span></div>
    </div>
    <h3 class="t">Casos por materia</h3>
    ${S.materias.map(m => {
      const cs = casosDe(m.id), a = activos(cs), pct = cs.length ? Math.round(a/cs.length*100) : 0;
      return `<button class="row" data-tab="${m.id}"><span class="nm">${esc(m.nombre)}</span>
        <span class="bar" title="${pct}% activos"><i style="width:${pct}%"></i></span>
        <span class="cnt">${a} activos de ${cs.length}</span></button>`;
    }).join("")}`;
}

function renderMateria(){
  const m = S.materias.find(x => x.id === tab);
  if (!m) { tab = "resumen"; return render(); }
  const todos = casosDe(m.id);
  const lista = filtro === "todos" ? todos : todos.filter(c => c.estado === filtro);
  $("#view").innerHTML = `
    <div class="head">
      <div><h2>${esc(m.nombre)}</h2><p class="sub" style="margin-bottom:20px">${todos.length} casos en total · ${activos(todos)} activos</p></div>
      <div style="margin-bottom:20px"><button class="btn" id="nuevo">+ Nuevo caso</button> <button class="btn ghost" id="delMat">Quitar materia</button></div>
    </div>
    <div class="filters">${["todos",...Object.keys(ESTADOS)].map(f =>
      `<button data-f="${f}" class="${filtro===f?"on":""}">${f==="todos"?"Todos":ESTADOS[f]}</button>`).join("")}</div>
    ${lista.length ? lista.map(c => `
      <article class="case st-${c.estado}">
        <div><span class="num">${esc(c.numero)}</span><h4>${esc(c.titulo)}</h4></div>
        <div class="side">
          <select data-id="${c.id}" aria-label="Estado del caso">${Object.entries(ESTADOS).map(([k,v]) =>
            `<option value="${k}" ${c.estado===k?"selected":""}>${v}</option>`).join("")}</select>
          <button class="del" data-del="${c.id}">Eliminar</button>
        </div>
        <div class="meta">${[c.parte, c.juzgado].filter(Boolean).map(esc).join(" · ") || "Sin más datos"}</div>
      </article>`).join("")
    : `<div class="empty">${filtro==="todos" ? "Aún no hay casos en esta materia. Pulsa “Nuevo caso” para registrar el primero." : "No hay casos con ese estado."}</div>`}`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; filtro = "todos"; return render(); }
  const f = e.target.closest("[data-f]"); if (f) { filtro = f.dataset.f; return render(); }
  const d = e.target.closest("[data-del]");
  if (d && confirm("¿Eliminar este caso?")) { S.casos = S.casos.filter(c => c.id != d.dataset.del); save(); return render(); }
  if (e.target.id === "nuevo") { $("#fCaso").reset(); $("#dCaso").showModal(); }
  if (e.target.id === "delMat" && confirm("¿Quitar esta materia y todos sus casos?")) {
    S.casos = S.casos.filter(c => c.materia !== tab); S.materias = S.materias.filter(m => m.id !== tab); save(); tab = "resumen"; render();
  }
  if (e.target.dataset.close !== undefined) e.target.closest("dialog").close();
});
document.addEventListener("change", e => {
  if (e.target.matches("select[data-id]")) {
    S.casos.find(c => c.id == e.target.dataset.id).estado = e.target.value; save(); render();
  }
});
$("#fCaso").addEventListener("submit", () => {
  const d = Object.fromEntries(new FormData($("#fCaso")));
  S.casos.push({id:Date.now(), materia:tab, ...d}); save(); render();
});
$("#addMat").onclick = () => { $("#fMat").reset(); $("#dMat").showModal(); };
$("#fMat").addEventListener("submit", () => {
  const nombre = new FormData($("#fMat")).get("nombre").trim();
  if (!nombre) return;
  const id = nombre.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-") + "-" + Date.now().toString(36);
  S.materias.push({id, nombre}); save(); tab = id; filtro = "todos"; render();
});
$("#exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));
  a.download = "respaldo-lrm.json"; a.click();
};
$("#imp").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.materias || !d.casos) throw 0;
    S = d; save(); tab = "resumen"; render();
  } catch(x) { alert("El archivo no es un respaldo válido."); }
};
render();
</script>
</body>
</html>
